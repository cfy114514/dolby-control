name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        shell: bash
        run: |
          sdkmanager${{ runner.os == 'Windows' && '.bat' || '' }} --install --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.14904198"
      - name: Fetch verified compile-only API
        run: python tools/fetch_deps.py
      - name: Check public source inventory
        run: python tools/check_repository.py
      - name: Host regression tests
        shell: python
        run: |
          import subprocess
          import sys
          import unittest

          class DiagnosticResult(unittest.TextTestResult):
              def addError(self, test, error):
                  failure = error[1]
                  if isinstance(failure, (subprocess.CalledProcessError, subprocess.TimeoutExpired)):
                      for output in (failure.stdout, failure.stderr):
                          if output:
                              print(output, file=sys.stderr)
                  super().addError(test, error)

          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2, resultclass=DiagnosticResult).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Python syntax
        run: python -m compileall -q tools tests
      - name: Firmware verification availability
        run: python tools/verify_table_spec.py
      - name: Build unsigned APK
        run: python tools/build.py --unsigned
      - name: Verify APK packaging
        run: python tools/check_package.py
      - name: Upload unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.os }}
          path: |
            dist/*-unsigned.apk
            build/identity.json
          if-no-files-found: error
